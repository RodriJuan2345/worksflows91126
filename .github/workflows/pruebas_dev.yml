
name: CI pruebas automatizadas en dev

"on":
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  test_app:
    name: Ejecutar pruebas de python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: configurar el entorno de python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar las pruebas (Unit, Integration, E2E)
        run: |
          echo "empezando con pruebas de python"
          python -m pytest --rootdir . -s

      - name: reporte final
        run: echo "pruebas aprobadas verifique el resultado"
